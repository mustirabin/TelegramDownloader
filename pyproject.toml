[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "tgdl"
version = "0.1.0"
description = "Telegram video downloader that catalogs episodes and movies into a library, with a local web UI"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "telethon>=1.36,<2",
    "cryptg>=0.4",
    "guessit>=3.8",
    "fastapi>=0.110",
    "uvicorn>=0.29",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "httpx>=0.27"]

[project.scripts]
tgdl = "tgdl.__main__:main"

[tool.setuptools.packages.find]
include = ["tgdl*"]

[tool.setuptools.package-data]
tgdl = ["static/*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
